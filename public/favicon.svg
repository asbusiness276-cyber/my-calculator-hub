<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base with Glow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brandGrad)" filter="url(#glow)" />
  
  <!-- Subtle Top Reflection Glare -->
  <path d="M 32 144 C 32 88, 88 32, 144 32 L 368 32 C 424 32, 480 88, 480 144 L 480 230 C 350 250, 160 220, 32 180 Z" fill="url(#glareGrad)" />

  <!-- Calculator Inner Frame -->
  <rect x="112" y="96" width="288" height="320" rx="36" fill="#0f172a" fill-opacity="0.25" stroke="#ffffff" stroke-width="12" stroke-opacity="0.8" />
  
  <!-- Calculator Screen -->
  <rect x="144" y="132" width="224" height="64" rx="16" fill="#ffffff" fill-opacity="0.95" />
  <rect x="160" y="152" width="80" height="24" rx="6" fill="#2563eb" />
  <rect x="280" y="152" width="68" height="24" rx="6" fill="#6366f1" fill-opacity="0.8" />

  <!-- Math Keys Grid -->
  <!-- Row 1 -->
  <rect x="144" y="224" width="56" height="52" rx="14" fill="#ffffff" fill-opacity="0.9" />
  <text x="172" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#2563eb" text-anchor="middle">+</text>

  <rect x="228" y="224" width="56" height="52" rx="14" fill="#ffffff" fill-opacity="0.9" />
  <text x="256" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#6366f1" text-anchor="middle">−</text>

  <rect x="312" y="224" width="56" height="52" rx="14" fill="#ffffff" fill-opacity="0.9" />
  <text x="340" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#db2777" text-anchor="middle">×</text>

  <!-- Row 2 -->
  <rect x="144" y="300" width="56" height="52" rx="14" fill="#ffffff" fill-opacity="0.9" />
  <text x="172" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#0891b2" text-anchor="middle">÷</text>

  <rect x="228" y="300" width="56" height="52" rx="14" fill="#ffffff" fill-opacity="0.9" />
  <text x="256" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#d97706" text-anchor="middle">%</text>

  <rect x="312" y="300" width="56" height="52" rx="14" fill="#ffffff" />
  <text x="340" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#10b981" text-anchor="middle">=</text>

  <!-- Sparkle Accent in Corner -->
  <path d="M 424 72 Q 436 96, 460 108 Q 436 120, 424 144 Q 412 120, 388 108 Q 412 96, 424 72 Z" fill="#fef08a" />
</svg>
